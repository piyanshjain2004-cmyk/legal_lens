<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Legal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">
        <aside class="sidebar">
            <h2>Legal Assistant</h2>
            <p>Indian law RAG project</p>

            <button id="buildButton">Build Knowledge Base</button>
            <button id="rebuildButton">Rebuild Knowledge Base</button>
            <button id="clearButton">Clear Chat</button>

            <div id="statusBox"></div>
        </aside>

        <main class="chat">
            <header class="chatHeader">
                <h1>AI Legal Assistant for Indian Laws</h1>
                <p>General legal information only, not professional legal advice.</p>
            </header>

            <section id="chatMessages" class="chatMessages">
                <div class="message bot">
                    Ask a question about Indian laws after building the knowledge base.
                </div>
            </section>

            <form id="questionForm" class="questionForm">
                <input id="questionInput" type="text" placeholder="Type your legal question..." autocomplete="off">
                <button type="submit">Ask</button>
            </form>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
